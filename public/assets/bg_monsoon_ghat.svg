<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="monsoonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="lushGhat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="wetTrack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Sky & Heavy Mist -->
  <rect width="1920" height="1080" fill="url(#monsoonSky)"/>

  <!-- Western Ghats Rolling Hills Silhouette -->
  <path d="M 600,600 Q 850,300 1150,480 T 1600,340 T 1920,450 L 1920,1080 L 600,1080 Z" fill="#042f2e" opacity="0.95"/>
  <path d="M 800,650 Q 1100,420 1400,560 T 1920,490 L 1920,1080 L 800,1080 Z" fill="url(#lushGhat)" opacity="0.9"/>

  <!-- Mountain Tunnel Portal (Kasara / Thal Ghat Curve) -->
  <path d="M 980,560 Q 1060,490 1140,560 L 1150,720 L 970,720 Z" fill="#021412" stroke="#134e4a" stroke-width="4"/>

  <!-- Mountain Mist Stratus Layers -->
  <path d="M 700,520 Q 1050,480 1450,530 T 1920,490" stroke="#a7f3d0" stroke-width="12" opacity="0.15" fill="none"/>
  <path d="M 850,600 Q 1200,560 1600,610 T 1920,580" stroke="#a7f3d0" stroke-width="18" opacity="0.12" fill="none"/>

  <!-- Waterfall Stream down Ghats -->
  <path d="M 1480,410 Q 1495,490 1475,560 T 1490,670" stroke="#6ee7b7" stroke-width="4" opacity="0.6" fill="none"/>

  <!-- Lush Foliage Trees Silhouettes -->
  <g fill="#022c22" opacity="0.8">
    <circle cx="850" cy="620" r="30"/>
    <circle cx="890" cy="610" r="38"/>
    <circle cx="930" cy="630" r="28"/>
    <circle cx="1200" cy="660" r="42"/>
    <circle cx="1250" cy="650" r="48"/>
    <circle cx="1310" cy="670" r="36"/>
    <circle cx="1580" cy="610" r="44"/>
    <circle cx="1640" cy="600" r="52"/>
  </g>

  <!-- Wet Ballast & Mountain Cutting -->
  <path d="M 800,740 L 1920,680 L 1920,1080 L 800,1080 Z" fill="#041a17"/>

  <!-- Wet Glistening Steel Rails through Valley -->
  <g opacity="0.85">
    <path d="M 1040,680 Q 1180,740 1450,880 T 1880,1080" stroke="url(#wetTrack)" stroke-width="6" fill="none"/>
    <path d="M 1080,680 Q 1230,740 1550,890 T 2050,1080" stroke="url(#wetTrack)" stroke-width="6" fill="none"/>
    
    <path d="M 990,690 Q 1120,750 1330,890 T 1680,1080" stroke="#34d399" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M 1030,690 Q 1170,750 1420,900 T 1820,1080" stroke="#34d399" stroke-width="5" fill="none" opacity="0.7"/>
  </g>

  <!-- Mumbai Central Suburban EMU emerging with Amber Headlights -->
  <g id="monsoonTrain">
    <path d="M 1280,620 L 1600,580 L 1740,780 L 1380,840 Z" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <path d="M 1290,630 L 1395,615 L 1420,690 L 1315,705 Z" fill="#0f766e" opacity="0.9"/>
    <!-- Headlights in Mist -->
    <circle cx="1340" cy="760" r="14" fill="#fef08a"/>
    <circle cx="1410" cy="750" r="14" fill="#fef08a"/>
    <polygon points="1340,760 1410,750 1750,980 1420,1030" fill="#fde047" opacity="0.25"/>
  </g>

  <!-- Fine Monsoon Rain Strands Overlay -->
  <g stroke="#a7f3d0" stroke-width="1" opacity="0.25">
    <line x1="900" y1="200" x2="820" y2="400"/>
    <line x1="1100" y1="180" x2="1020" y2="380"/>
    <line x1="1300" y1="220" x2="1220" y2="420"/>
    <line x1="1500" y1="190" x2="1420" y2="390"/>
    <line x1="1700" y1="210" x2="1620" y2="410"/>
    <line x1="1000" y1="450" x2="920" y2="650"/>
    <line x1="1250" y1="480" x2="1170" y2="680"/>
    <line x1="1450" y1="440" x2="1370" y2="640"/>
    <line x1="1650" y1="490" x2="1570" y2="690"/>
  </g>
</svg>
