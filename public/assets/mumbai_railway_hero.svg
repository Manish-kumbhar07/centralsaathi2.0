<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Twilight Gradient -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050d18" />
      <stop offset="35%" stop-color="#091b2e" />
      <stop offset="60%" stop-color="#142c47" />
      <stop offset="78%" stop-color="#2d3b54" />
      <stop offset="90%" stop-color="#7c4a27" />
      <stop offset="96%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Warm Station Light Radial Glow -->
    <radialGradient id="goldenHourGlow" cx="65%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#b45309" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#0f2137" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050d18" stop-opacity="0" />
    </radialGradient>

    <!-- Platform Canopy Light -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fde68a" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Steel Rail Metallic Gradient -->
    <linearGradient id="steelRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ballast Gravel Texture Pattern -->
    <pattern id="ballastPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0c1724" />
      <circle cx="6" cy="8" r="2.5" fill="#1e293b" opacity="0.7"/>
      <circle cx="24" cy="14" r="3" fill="#172554" opacity="0.6"/>
      <circle cx="16" cy="30" r="2" fill="#334155" opacity="0.5"/>
      <circle cx="34" cy="26" r="2.8" fill="#1e293b" opacity="0.7"/>
      <circle cx="30" cy="38" r="2" fill="#0f172a" opacity="0.8"/>
    </pattern>

    <!-- Train Body Gradient -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="55%" stop-color="#475569" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Green Central Railway Stripe -->
    <linearGradient id="crGreenStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Base Sky -->
  <rect width="1920" height="1080" fill="url(#twilightSky)" />

  <!-- Stars in Upper Twilight -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="140" cy="90" r="1.5" />
    <circle cx="280" cy="140" r="1.2" />
    <circle cx="450" cy="70" r="2" />
    <circle cx="620" cy="110" r="1.4" />
    <circle cx="850" cy="80" r="1.8" />
    <circle cx="1020" cy="130" r="1.2" />
    <circle cx="1200" cy="95" r="1.6" />
    <circle cx="1380" cy="65" r="2.2" />
    <circle cx="1540" cy="120" r="1.3" />
    <circle cx="1720" cy="85" r="1.7" />
    <circle cx="1840" cy="145" r="1.4" />
    <circle cx="340" cy="220" r="1.2" />
    <circle cx="780" cy="190" r="1.5" />
    <circle cx="1290" cy="210" r="1.4" />
  </g>

  <!-- Ambient Horizon Glow -->
  <rect width="1920" height="1080" fill="url(#goldenHourGlow)" />

  <!-- CST / Mumbai Heritage Skyline Silhouettes (Left & Center Background) -->
  <g fill="#071320" opacity="0.85">
    <!-- Victorian Gables, Towers & Central Dome Silhouette of CSMT -->
    <path d="M 0 680 L 0 520 L 40 520 L 50 490 L 70 490 L 80 520 L 140 520 L 150 460 L 160 460 L 170 430 L 180 430 L 190 390 L 200 390 L 205 340 L 210 390 L 220 390 L 230 430 L 240 430 L 250 460 L 260 460 L 270 520 L 330 520 L 340 480 L 370 480 L 380 520 L 420 520 L 430 440 L 460 440 L 470 520 L 550 520 L 580 410 L 610 360 C 640 310, 710 310, 740 360 L 770 410 L 800 520 L 880 520 L 890 470 L 920 470 L 930 520 L 980 520 L 1020 450 L 1050 450 L 1080 520 L 1150 520 L 1180 480 L 1220 480 L 1250 520 L 1320 520 L 1340 440 L 1370 440 L 1390 520 L 1480 520 L 1500 480 L 1540 480 L 1560 520 L 1920 520 L 1920 680 Z" />
    <!-- Clock Tower Finial on CST Dome -->
    <path d="M 672 315 L 675 240 L 678 315 Z" fill="#071320" />
    <circle cx="675" cy="235" r="4" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Distant High-Rise City Towers & Silhouettes (Right) -->
  <g fill="#0b1a2a" opacity="0.7">
    <rect x="1420" y="380" width="45" height="280" />
    <rect x="1480" y="320" width="55" height="340" />
    <rect x="1550" y="360" width="40" height="300" />
    <rect x="1610" y="290" width="60" height="370" />
    <rect x="1685" y="340" width="50" height="320" />
    <rect x="1750" y="400" width="65" height="260" />
    <rect x="1830" y="330" width="55" height="330" />
  </g>

  <!-- Windows glowing amber in distant skyscrapers -->
  <g fill="#fbbf24" opacity="0.45">
    <rect x="1490" y="340" width="4" height="6" />
    <rect x="1505" y="360" width="4" height="6" />
    <rect x="1520" y="340" width="4" height="6" />
    <rect x="1625" y="310" width="5" height="7" />
    <rect x="1645" y="330" width="5" height="7" />
    <rect x="1630" y="360" width="5" height="7" />
    <rect x="1650" y="390" width="5" height="7" />
    <rect x="1700" y="360" width="4" height="6" />
    <rect x="1715" y="390" width="4" height="6" />
    <rect x="1845" y="350" width="4" height="6" />
    <rect x="1865" y="380" width="4" height="6" />
  </g>

  <!-- Grand Victorian Arched Platform Canopy Trusses (Foreground Overhead Roof) -->
  <g stroke="#1a2b3c" stroke-width="6" fill="none" opacity="0.85">
    <!-- Huge Arched Beams sweeping across top -->
    <path d="M -50 250 Q 480 80, 1020 180 T 1980 120" />
    <path d="M -50 290 Q 480 120, 1020 220 T 1980 160" />
    <!-- Lattice Cross Struts -->
    <line x1="80" y1="230" x2="110" y2="280" />
    <line x1="160" y1="210" x2="190" y2="260" />
    <line x1="240" y1="190" x2="270" y2="245" />
    <line x1="320" y1="175" x2="350" y2="235" />
    <line x1="410" y1="165" x2="440" y2="225" />
    <line x1="510" y1="160" x2="540" y2="220" />
    <line x1="620" y1="165" x2="650" y2="220" />
    <line x1="740" y1="170" x2="770" y2="225" />
    <line x1="860" y1="180" x2="890" y2="235" />
    <line x1="980" y1="195" x2="1010" y2="245" />
    <line x1="1100" y1="200" x2="1130" y2="250" />
    <line x1="1240" y1="185" x2="1270" y2="235" />
    <line x1="1380" y1="170" x2="1410" y2="220" />
    <line x1="1520" y1="160" x2="1550" y2="210" />
    <line x1="1660" y1="150" x2="1690" y2="200" />
    <line x1="1800" y1="140" x2="1830" y2="190" />
  </g>

  <!-- Hanging Victorian Station Lanterns with warm glow -->
  <g>
    <!-- Lantern 1 -->
    <line x1="240" y1="215" x2="240" y2="310" stroke="#334155" stroke-width="3" />
    <circle cx="240" cy="325" r="70" fill="url(#lampGlow)" />
    <circle cx="240" cy="320" r="10" fill="#fef08a" />
    <polygon points="230,310 250,310 245,330 235,330" fill="#0f172a" />

    <!-- Lantern 2 -->
    <line x1="620" y1="190" x2="620" y2="290" stroke="#334155" stroke-width="3" />
    <circle cx="620" cy="305" r="85" fill="url(#lampGlow)" />
    <circle cx="620" cy="300" r="12" fill="#fef08a" />
    <polygon points="210,290 630,290 626,312 614,312" fill="#0f172a" />

    <!-- Lantern 3 -->
    <line x1="1100" y1="225" x2="1100" y2="330" stroke="#334155" stroke-width="3" />
    <circle cx="1100" cy="345" r="75" fill="url(#lampGlow)" />
    <circle cx="1100" cy="340" r="11" fill="#fef08a" />
    <polygon points="1090,330 1110,330 1106,352 1094,352" fill="#0f172a" />

    <!-- Lantern 4 -->
    <line x1="1550" y1="185" x2="1550" y2="280" stroke="#334155" stroke-width="3" />
    <circle cx="1550" cy="295" r="90" fill="url(#lampGlow)" />
    <circle cx="1550" cy="290" r="13" fill="#fef08a" />
    <polygon points="1540,280 1560,280 1556,302 1544,302" fill="#0f172a" />
  </g>

  <!-- Overhead Catenary (OHE) Wires & Portals -->
  <g stroke="#334155" stroke-width="1.8" opacity="0.6">
    <line x1="0" y1="410" x2="1920" y2="410" />
    <line x1="0" y1="440" x2="1920" y2="460" />
    <!-- Catenary Droppers -->
    <line x1="180" y1="410" x2="180" y2="442" stroke-width="1" />
    <line x1="380" y1="410" x2="380" y2="446" stroke-width="1" />
    <line x1="580" y1="410" x2="580" y2="449" stroke-width="1" />
    <line x1="780" y1="410" x2="780" y2="452" stroke-width="1" />
    <line x1="980" y1="410" x2="980" y2="454" stroke-width="1" />
    <line x1="1180" y1="410" x2="1180" y2="456" stroke-width="1" />
    <line x1="1380" y1="410" x2="1380" y2="458" stroke-width="1" />
    <!-- OHE Steel Mast Posts -->
    <rect x="375" y="320" width="10" height="280" fill="#1e293b" />
    <rect x="1175" y="310" width="10" height="300" fill="#1e293b" />
  </g>

  <!-- Railway Signals (Signal Post on Right with Green Aspect) -->
  <g>
    <rect x="1310" y="390" width="8" height="180" fill="#1e293b" />
    <rect x="1302" y="360" width="24" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="1314" cy="375" r="6" fill="#1e293b" />
    <circle cx="1314" cy="395" r="6" fill="#10b981" />
    <!-- Signal Light Green Aura -->
    <circle cx="1314" cy="395" r="28" fill="#10b981" opacity="0.35" />
    <circle cx="1314" cy="395" r="8" fill="#a7f3d0" />
  </g>

  <!-- Track Bed / Ballast Foundation -->
  <rect x="0" y="580" width="1920" height="500" fill="url(#ballastPattern)" />

  <!-- Platform 1 Concourse (Left Platform) -->
  <polygon points="0,540 480,540 380,1080 0,1080" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <!-- Platform Yellow Safety Tactile Edge -->
  <polygon points="450,540 480,540 380,1080 340,1080" fill="#eab308" opacity="0.9" />
  <!-- Yellow Warning Strip Dotted Lines -->
  <line x1="465" y1="540" x2="360" y2="1080" stroke="#ca8a04" stroke-width="3" stroke-dasharray="10,8" />

  <!-- Platform Passenger Waiting Silhouettes (Left) -->
  <g fill="#0a131e" opacity="0.9">
    <ellipse cx="260" cy="520" rx="7" ry="9" />
    <path d="M 250 530 Q 260 528, 270 530 L 275 600 L 245 600 Z" />
    <!-- Commuter with shoulder bag -->
    <ellipse cx="295" cy="522" rx="6" ry="8" />
    <path d="M 288 531 Q 295 529, 304 531 L 308 595 L 284 595 Z" />
    <rect x="303" y="540" width="8" height="15" rx="3" fill="#050a10" />
    <!-- Seated Passenger on Platform Bench -->
    <rect x="140" y="560" width="60" height="10" rx="3" fill="#334155" />
    <ellipse cx="160" cy="545" rx="6" ry="8" />
    <rect x="154" y="554" width="14" height="24" rx="3" />
    <ellipse cx="180" cy="546" rx="6" ry="8" />
    <rect x="174" y="555" width="14" height="23" rx="3" />
  </g>

  <!-- Platform Digital LED Indicator (Left Platform) -->
  <g>
    <rect x="190" y="440" width="130" height="38" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <text x="200" y="456" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">CSMT FAST  12-CAR</text>
    <text x="200" y="470" fill="#34d399" font-family="monospace" font-size="10">PF 1 · EXP: 08:32</text>
  </g>

  <!-- Railway Tracks (Curving gracefully toward the center and vanishing point) -->
  <g>
    <!-- Railway Sleepers (Ties) - Perspective Spacing -->
    <!-- Distant Sleepers -->
    <g stroke="#1e293b" stroke-width="6" opacity="0.8">
      <line x1="560" y1="590" x2="880" y2="590" />
      <line x1="550" y1="610" x2="900" y2="610" />
      <line x1="540" y1="635" x2="925" y2="635" />
      <line x1="530" y1="665" x2="955" y2="665" />
      <line x1="520" y1="700" x2="990" y2="700" stroke-width="8" />
      <line x1="505" y1="740" x2="1030" y2="740" stroke-width="9" />
      <line x1="490" y1="785" x2="1080" y2="785" stroke-width="11" />
      <line x1="470" y1="840" x2="1140" y2="840" stroke-width="13" />
      <line x1="445" y1="905" x2="1215" y2="905" stroke-width="16" />
      <line x1="415" y1="980" x2="1300" y2="980" stroke-width="19" />
      <line x1="380" y1="1070" x2="1410" y2="1070" stroke-width="23" />
    </g>

    <!-- Track 1: Left Steel Rail with Metallic Reflection -->
    <path d="M 620 570 Q 560 760, 410 1080" fill="none" stroke="#1e293b" stroke-width="14" />
    <path d="M 620 570 Q 560 760, 410 1080" fill="none" stroke="url(#steelRail)" stroke-width="8" />
    <path d="M 620 570 Q 560 760, 410 1080" fill="none" stroke="#f8fafc" stroke-width="2.5" opacity="0.8" />

    <!-- Track 1: Right Steel Rail with Metallic Reflection -->
    <path d="M 820 570 Q 940 760, 1340 1080" fill="none" stroke="#1e293b" stroke-width="14" />
    <path d="M 820 570 Q 940 760, 1340 1080" fill="none" stroke="url(#steelRail)" stroke-width="8" />
    <path d="M 820 570 Q 940 760, 1340 1080" fill="none" stroke="#f8fafc" stroke-width="2.5" opacity="0.8" />

    <!-- Secondary Track / Loop Line on Right -->
    <g opacity="0.7">
      <path d="M 1050 580 Q 1250 780, 1720 1080" fill="none" stroke="url(#steelRail)" stroke-width="6" />
      <path d="M 1190 580 Q 1460 780, 1980 1080" fill="none" stroke="url(#steelRail)" stroke-width="6" />
    </g>
  </g>

  <!-- Modern Mumbai Suburban Local EMU Train (Approaching along Platform 2 on Track) -->
  <g>
    <!-- Train Headlight Cast Light Cone on Rails -->
    <polygon points="760,540 680,555 420,860 920,820" fill="url(#headlightBeam)" opacity="0.45" />

    <!-- Front Cabin Rake Body -->
    <path d="M 690 410 Q 755 385, 820 410 L 845 540 Q 755 565, 665 540 Z" fill="url(#trainBodyGrad)" stroke="#64748b" stroke-width="3" />

    <!-- Train Aerodynamic Front Windshield (Motorman Cabin) -->
    <path d="M 700 425 Q 755 410, 810 425 L 818 475 Q 755 485, 692 475 Z" fill="#091b2e" stroke="#047857" stroke-width="3" />
    <!-- Interior Cabin Green Glow & Wiper -->
    <path d="M 710 435 Q 755 425, 800 435 L 805 465 Q 755 475, 705 465 Z" fill="#047857" opacity="0.5" />
    <line x1="755" y1="420" x2="745" y2="470" stroke="#94a3b8" stroke-width="2" />

    <!-- Destination Display Board above Windshield -->
    <rect x="720" y="400" width="70" height="15" rx="3" fill="#020617" stroke="#fbbf24" stroke-width="1.5" />
    <text x="732" y="411" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold">CSMT</text>

    <!-- Central Railway Signature Green & Yellow Livery Band -->
    <path d="M 680 488 Q 755 500, 830 488 L 833 506 Q 755 518, 677 506 Z" fill="url(#crGreenStripe)" />
    <path d="M 677 506 Q 755 518, 833 506 L 836 516 Q 755 528, 674 516 Z" fill="#fbbf24" />

    <!-- Dual Powerful Headlights with Intense Warm Glow -->
    <!-- Left Headlight -->
    <circle cx="705" cy="528" r="45" fill="url(#lampGlow)" opacity="0.8" />
    <circle cx="705" cy="528" r="9" fill="#fffbeb" />
    <circle cx="705" cy="528" r="5" fill="#ffffff" />
    <!-- Right Headlight -->
    <circle cx="805" cy="528" r="45" fill="url(#lampGlow)" opacity="0.8" />
    <circle cx="805" cy="528" r="9" fill="#fffbeb" />
    <circle cx="805" cy="528" r="5" fill="#ffffff" />

    <!-- Motorman Rake Cowcatcher / Pilot Fender -->
    <polygon points="680,545 830,545 815,565 695,565" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Red Indicator Flasher on Roof -->
    <circle cx="755" cy="385" r="4" fill="#ef4444" />
    <circle cx="755" cy="385" r="14" fill="#ef4444" opacity="0.4" />

    <!-- Trailing Coaches (Perspective Depth Receding Backwards) -->
    <path d="M 820 410 L 980 435 L 980 525 L 845 540 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 830 488 L 980 495 L 980 505 L 833 506 Z" fill="url(#crGreenStripe)" />
    <!-- Illuminated Passenger Windows in Coach -->
    <rect x="850" y="440" width="22" height="26" rx="3" fill="#fef08a" opacity="0.85" />
    <rect x="880" y="443" width="24" height="26" rx="3" fill="#fef08a" opacity="0.8" />
    <rect x="912" y="446" width="24" height="26" rx="3" fill="#fef08a" opacity="0.85" />
    <rect x="944" y="449" width="24" height="26" rx="3" fill="#fef08a" opacity="0.75" />

    <!-- Third Receding Coach -->
    <path d="M 980 435 L 1120 455 L 1120 515 L 980 525 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <rect x="995" y="455" width="18" height="20" rx="2" fill="#fbbf24" opacity="0.6" />
    <rect x="1020" y="458" width="18" height="20" rx="2" fill="#fbbf24" opacity="0.6" />
    <rect x="1045" y="461" width="18" height="20" rx="2" fill="#fbbf24" opacity="0.5" />

    <!-- Pantograph on Top of Train contacting OHE Wire with Electric Spark -->
    <line x1="755" y1="385" x2="745" y2="435" stroke="#94a3b8" stroke-width="2.5" />
    <polygon points="735,432 755,432 750,436 740,436" fill="#cbd5e1" />
    <circle cx="745" cy="434" r="8" fill="#38bdf8" opacity="0.6" />
    <circle cx="745" cy="434" r="2" fill="#ffffff" />
  </g>

  <!-- Platform 2 (Right Platform with Waiting Shed) -->
  <polygon points="1260,570 1920,550 1920,1080 1480,1080" fill="#14202e" stroke="#334155" stroke-width="2" />
  <polygon points="1260,570 1285,570 1520,1080 1480,1080" fill="#eab308" opacity="0.85" />

  <!-- Soft Ambient Ground Fog/Mist along Tracks -->
  <ellipse cx="900" cy="620" rx="600" ry="40" fill="#064e3b" opacity="0.12" />
  <ellipse cx="600" cy="780" rx="450" ry="50" fill="#fbbf24" opacity="0.08" />

  <!-- Vignette Gradient Borders -->
  <rect width="1920" height="1080" fill="none" stroke="#050d18" stroke-width="20" opacity="0.5" />
</svg>
